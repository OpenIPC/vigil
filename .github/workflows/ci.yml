# SPDX-License-Identifier: GPL-3.0-or-later
name: ci
on: [push, pull_request]
jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ffmpeg python3-gi gir1.2-gst-rtsp-server-1.0 \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Build
        run: cmake -S . -B build -DVIGIL_PLATFORM=generic && cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  rockchip:
    # The rockchip platform (MPP + RGA + DRM + LVGL UI) on an arm64 runner:
    # the libraries are built from source by the same script the boards use.
    # Compile-only — runners have no VPU, RGA or display.
    name: Rockchip build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build pkg-config libdrm-dev
          sudo WORK=/tmp/vigil-deps scripts/rockchip/build-deps.sh
      - name: Build
        run: cmake -S . -B build -DVIGIL_PLATFORM=rockchip -DBUILD_TESTING=OFF && cmake --build build -j
